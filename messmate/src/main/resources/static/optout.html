<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Meal Opt-Out - MessMate</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body class="dashboard-page">

<nav class="navbar">

    <div class="nav-container">

        <a href="student-dashboard.html" class="brand">
            MessMate
        </a>

        <div class="nav-links">
            <a href="student-dashboard.html">Dashboard</a>
            <a href="menu.html">Menu</a>
            <a href="feedback.html">Feedback</a>
            <a href="#" id="logoutBtn">Logout</a>
        </div>

    </div>

</nav>

<main>

    <section class="dashboard-header">

        <div>
            <p class="small-title">STUDENT PORTAL</p>

            <h1>Meal Opt-Out</h1>

            <p>
                Select a meal if you do not want to attend it.
            </p>
        </div>

    </section>

    <section class="student-profile-card">

        <h2>Select Meal</h2>

        <br>

        <form id="optOutForm">

            <label for="meal">
                Meal
            </label>

            <select id="meal" required>

                <option value="">
                    Loading meals...
                </option>

            </select>

            <br><br>

            <button
                    type="submit"
                    class="auth-button">
                Opt Out
            </button>

        </form>

        <div id="message"></div>

    </section>

</main>

<script>

    const studentId =
        localStorage.getItem("studentId");

    if (!studentId) {
        window.location.href = "student-login.html";
    }


    async function loadMeals() {

        const select =
            document.getElementById("meal");

        const today =
            new Date();

        const date =
            today.toISOString().split("T")[0];

        try {

            const response =
                await fetch(
                    "/api/meals?from=" +
                    date +
                    "&to=" +
                    date
                );

            if (!response.ok) {
                throw new Error("Unable to load meals.");
            }

            const meals =
                await response.json();

            select.innerHTML =
                '<option value="">Select a meal</option>';

            meals.forEach(function (meal) {

                const option =
                    document.createElement("option");

                option.value =
                    meal.id;

                option.textContent =
                    meal.mealDate +
                    " - " +
                    meal.mealType;

                select.appendChild(option);

            });

        } catch (error) {

            select.innerHTML =
                '<option value="">Unable to load meals</option>';

            document.getElementById("message")
                .className = "error-message";

            document.getElementById("message")
                .textContent = error.message;
        }
    }


    document
        .getElementById("optOutForm")
        .addEventListener("submit", async function (event) {

            event.preventDefault();

            const mealId =
                document.getElementById("meal").value;

            const message =
                document.getElementById("message");

            if (!mealId) {
                return;
            }

            try {

                const response =
                    await fetch(
                        "/api/opt-outs?residentId=" +
                        encodeURIComponent(studentId) +
                        "&mealId=" +
                        encodeURIComponent(mealId),
                        {
                            method: "POST"
                        }
                    );

                const result =
                    await response.json().catch(() => ({}));

                if (!response.ok) {

                    throw new Error(
                        result.message ||
                        "Unable to opt out of the meal."
                    );
                }

                message.className =
                    "success-message";

                message.textContent =
                    "Meal opt-out recorded successfully.";

            } catch (error) {

                message.className =
                    "error-message";

                message.textContent =
                    error.message;
            }

        });


    document
        .getElementById("logoutBtn")
        .addEventListener("click", function (event) {

            event.preventDefault();

            localStorage.removeItem("studentId");
            localStorage.removeItem("studentRollNumber");

            window.location.href =
                "student-login.html";
        });


    loadMeals();

</script>

</body>

</html>
