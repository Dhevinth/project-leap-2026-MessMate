<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Meal Feedback - MessMate</title>

    <link rel="stylesheet"
          href="css/style.css">

</head>

<body class="dashboard-page">

<nav class="navbar">

    <div class="nav-container">

        <a href="student-dashboard.html"
           class="brand">
            MessMate
        </a>

        <div class="nav-links">

            <a href="student-dashboard.html">
                Dashboard
            </a>

            <a href="menu.html">
                Menu
            </a>

            <a href="optout.html">
                Meal Opt-Out
            </a>

            <a href="#"
               id="logoutBtn">
                Logout
            </a>

        </div>

    </div>

</nav>


<main>

    <section class="dashboard-header">

        <div>

            <p class="small-title">
                STUDENT PORTAL
            </p>

            <h1>
                Meal Feedback
            </h1>

            <p>
                Rate your meal and share your feedback.
            </p>

        </div>

    </section>


    <section class="student-profile-card">

        <h2>
            Submit Feedback
        </h2>

        <br>


        <form id="feedbackForm">

            <label for="meal">
                Select Meal
            </label>

            <select id="meal"
                    required>

                <option value="">
                    Loading meals...
                </option>

            </select>


            <br><br>


            <label for="rating">
                Rating
            </label>

            <select id="rating"
                    required>

                <option value="">
                    Select rating
                </option>

                <option value="1">
                    1 - Very Poor
                </option>

                <option value="2">
                    2 - Poor
                </option>

                <option value="3">
                    3 - Average
                </option>

                <option value="4">
                    4 - Good
                </option>

                <option value="5">
                    5 - Excellent
                </option>

            </select>


            <br><br>


            <label for="comment">
                Comment
            </label>

            <textarea
                    id="comment"
                    rows="5"
                    placeholder="Write your feedback..."
            ></textarea>


            <br>


            <button
                    type="submit"
                    class="auth-button">

                Submit Feedback

            </button>

        </form>


        <div id="message"></div>

    </section>

</main>


<script>

    const studentId =
        localStorage.getItem("studentId");


    if (!studentId) {

        window.location.href =
            "student-login.html";

    }


    async function loadMeals() {

        const select =
            document.getElementById("meal");


        const today =
            new Date();


        const date =
            today.toISOString().split("T")[0];


        try {

            const response =
                await fetch(
                    "/api/meals?from=" +
                    date +
                    "&to=" +
                    date
                );


            if (!response.ok) {

                throw new Error(
                    "Unable to load meals."
                );

            }


            const meals =
                await response.json();


            select.innerHTML =
                '<option value="">Select a meal</option>';


            meals.forEach(function (meal) {

                const option =
                    document.createElement("option");


                option.value =
                    meal.id;


                option.textContent =
                    meal.mealDate +
                    " - " +
                    meal.mealType;


                select.appendChild(option);

            });


        } catch (error) {

            select.innerHTML =
                '<option value="">Unable to load meals</option>';

            document.getElementById("message")
                .className = "error-message";

            document.getElementById("message")
                .textContent = error.message;

        }

    }


    document
        .getElementById("feedbackForm")
        .addEventListener("submit", async function (event) {

            event.preventDefault();


            const mealId =
                document.getElementById("meal").value;


            const rating =
                document.getElementById("rating").value;


            const comment =
                document.getElementById("comment")
                    .value.trim();


            const message =
                document.getElementById("message");


            try {

                const response =
                    await fetch(
                        "/api/feedback",
                        {
                            method: "POST",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            body: JSON.stringify({

                                residentId:
                                    Number(studentId),

                                mealId:
                                    Number(mealId),

                                rating:
                                    Number(rating),

                                comment:
                                comment

                            })
                        }
                    );


                const result =
                    await response.json()
                        .catch(() => ({}));


                if (!response.ok) {

                    throw new Error(
                        result.message ||
                        "Unable to submit feedback."
                    );

                }


                message.className =
                    "success-message";


                message.textContent =
                    "Feedback submitted successfully.";


                document
                    .getElementById("feedbackForm")
                    .reset();


            } catch (error) {

                message.className =
                    "error-message";


                message.textContent =
                    error.message;

            }

        });


    document
        .getElementById("logoutBtn")
        .addEventListener("click", function (event) {

            event.preventDefault();


            localStorage.removeItem("studentId");

            localStorage.removeItem(
                "studentRollNumber"
            );


            window.location.href =
                "student-login.html";

        });


    loadMeals();

</script>

</body>

</html>
